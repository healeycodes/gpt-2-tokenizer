[package]
name = "gpt2-tokenizer"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.17.0"
lru = "0.18.3"
rustc-hash = "2.1.1"
serde_json = "1.0.151"
tiktoken-rs = "0.12.0"

[profile.release]
debug = true

[[bin]]
name = "bench-baseline"
path = "src/bench_baseline.rs"

[[bin]]
name = "profile"
path = "src/profile_main.rs"
